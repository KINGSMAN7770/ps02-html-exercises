<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localization</title>
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Localization</h1>
<p>
  <button data-lang="en">English</button>
  <button data-lang="ru">Русский</button>
  <button data-lang="ky">Кыргызча</button>
</p>
<h2 data-i18n="greeting">Hello!</h2>
<p data-i18n="text">Welcome to my multilingual website.</p>
</main>
<script>
const dict = {
  en: { greeting: 'Hello!', text: 'Welcome to my multilingual website.' },
  ru: { greeting: 'Привет!', text: 'Добро пожаловать на мой многоязычный сайт.' },
  ky: { greeting: 'Салам!', text: 'Көп тилдүү сайтыма кош келиңиз.' }
};
document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => {
  const lang = btn.dataset.lang;
  document.documentElement.lang = lang; // update the lang attribute
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = dict[lang][el.dataset.i18n]);
}));
</script>
</body>
</html>
