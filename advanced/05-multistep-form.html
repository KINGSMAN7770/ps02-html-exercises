<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Step Form</title>
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Multi-Step Form</h1>
<p id="stepinfo">Step 1 of 3</p>
<form id="f" action="#">
  <fieldset class="step"><legend>Account</legend>
    <label for="em">Email</label><br><input id="em" type="email" required></fieldset>
  <fieldset class="step" hidden><legend>Profile</legend>
    <label for="nm">Full name</label><br><input id="nm" required></fieldset>
  <fieldset class="step" hidden><legend>Confirm</legend>
    <label><input type="checkbox" id="agree" required> I agree to the terms</label></fieldset>
  <p>
    <button type="button" id="prev" disabled>Back</button>
    <button type="button" id="next">Next</button>
    <button type="submit" id="submit" hidden>Submit</button>
  </p>
</form>
<p id="done" hidden>Form submitted. Thank you!</p>
</main>
<script>
const steps = document.querySelectorAll('.step');
let cur = 0;
function show() {
  steps.forEach((s, i) => s.hidden = i !== cur);
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').hidden = cur === steps.length - 1;
  document.getElementById('submit').hidden = cur !== steps.length - 1;
  document.getElementById('stepinfo').textContent = `Step ${cur + 1} of ${steps.length}`;
}
document.getElementById('next').onclick = () => {
  const inputs = steps[cur].querySelectorAll('input');
  for (const inp of inputs) if (!inp.reportValidity()) return; // validate current step
  cur++; show();
};
document.getElementById('prev').onclick = () => { cur--; show(); };
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  e.target.hidden = true;
  document.getElementById('done').hidden = false;
};
</script>
</body>
</html>
