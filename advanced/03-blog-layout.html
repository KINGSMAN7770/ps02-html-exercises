<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Layout (Grid)</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.blog { display: grid; grid-template-columns: 3fr 1fr; gap: 1.5rem; }
@media (max-width: 700px) { .blog { grid-template-columns: 1fr; } }
.posts article, .sidebar { background: #fff; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
</style>
</head>
<body>
<p class="back"><a href="index.html">&larr; Back to list</a></p>
<main class="container">
<h1>Blog Layout (Grid)</h1>
<div class="blog">
  <main class="posts">
    <article><h2>Post one</h2><p>CSS Grid lets you build two-dimensional layouts easily.</p></article>
    <article><h2>Post two</h2><p>Flexbox is great for one-dimensional alignment.</p></article>
    <article><h2>Post three</h2><p>Combine them for the best results.</p></article>
  </main>
  <aside class="sidebar">
    <h3>About</h3><p>A student blog about web development.</p>
    <h3>Categories</h3><ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
  </aside>
</div>
</main>
</body>
</html>
