<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Loading Animation</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.spinner { width: 60px; height: 60px; border: 6px solid #ddd; border-top-color: #1a5fd0; border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.dots span { display: inline-block; width: 16px; height: 16px; margin: 4px; background: #f25f5c; border-radius: 50%; animation: bounce .6s infinite alternate; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { to { transform: translateY(-16px); opacity: .4; } }
</style>
</head>
<body>
<p class="back"><a href="index.html">&larr; Back to list</a></p>
<main class="container">
<h1>CSS Loading Animation</h1>
<div class="spinner" role="status" aria-label="Loading"></div>
<div class="dots"><span></span><span></span><span></span></div>
</main>
</body>
</html>
