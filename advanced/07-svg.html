<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive SVG</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.shape { cursor: pointer; transition: fill .2s; }
.shape:hover { fill: #c94f9a; }
</style>
</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Interactive SVG</h1>
<p>Hover over a shape to change its colour, click to make it random.</p>
<svg width="360" height="160" viewBox="0 0 360 160">
  <rect class="shape" x="20" y="30" width="100" height="100" fill="#4f86f7"/>
  <circle class="shape" cx="190" cy="80" r="50" fill="#4fc98a"/>
  <polygon class="shape" points="290,30 340,130 240,130" fill="#f7a64f"/>
</svg>
</main>
<script>
document.querySelectorAll('.shape').forEach(s => s.addEventListener('click', () => {
  s.setAttribute('fill', '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
}));
</script>
</body>
</html>
