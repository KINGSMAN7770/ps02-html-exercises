<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Contact Form</h1>
<form action="#" method="post">
  <p><label for="n">Name</label><br><input id="n" name="name" required></p>
  <p><label for="e">Email</label><br><input id="e" type="email" name="email" required></p>
  <p><label for="s">Subject</label><br><input id="s" name="subject"></p>
  <p><label for="m">Message</label><br><textarea id="m" name="message" rows="5" cols="40"></textarea></p>
  <button type="submit">Send</button>
</form>
</main>
</body>
</html>
