<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Canvas</h1>
<canvas id="c" width="300" height="200" style="border:1px solid #ccc;background:#fff"></canvas>
</main>
<script>
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#4f86f7';
ctx.fillRect(20, 20, 120, 80);      // rectangle
ctx.beginPath();
ctx.arc(220, 120, 50, 0, Math.PI * 2); // circle
ctx.fillStyle = '#f25f5c';
ctx.fill();
</script>
</body>
</html>
