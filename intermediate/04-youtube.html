<h1>YouTube Video Player</h1>
<p>Autoplay works only when the video is muted (browser rule), so <code>mute=1</code> is added.</p>
<iframe width="560" height="315"
  src="https://www.youtube.com/embed/M7lc1UVf-VE?autoplay=1&amp;mute=1&amp;controls=1"
