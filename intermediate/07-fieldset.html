<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldset and Legend</title>
<link rel="stylesheet" href="../css/style.css">

</head>
<body>
<p class="back"><a href="../index.html">&larr; Back to assignments</a></p>
<main class="container">
<h1>Fieldset and Legend</h1>
<form action="#">
  <fieldset>
    <legend>Personal info</legend>
    <label for="fn">First name</label> <input id="fn"><br>
    <label for="ln">Last name</label> <input id="ln">
  </fieldset>
  <fieldset>
    <legend>Preferred contact</legend>
    <label><input type="radio" name="c" value="email"> Email</label>
    <label><input type="radio" name="c" value="phone"> Phone</label>
  </fieldset>
  <button>Submit</button>
</form>
</main>
</body>
</html>
